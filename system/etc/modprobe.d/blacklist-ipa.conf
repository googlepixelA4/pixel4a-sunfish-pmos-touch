# Pixel 4a (sunfish): the IPA driver (mobile-data offload) triggers a silent
# cold reset of the SoC early in boot (reset loop, empty pstore).
# Found by the Mobian port: github.com/miromraz/mobian-pixel4a-port docs/internals.md
# Cost: no mobile data through IPA.
blacklist ipa
install ipa /bin/false
